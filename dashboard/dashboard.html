<!DOCTYPE html>
<html lang="fr">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Smart Energy — Real-Time Dashboard</title>
    <!-- Firebase App (the core Firebase SDK) -->
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-database-compat.js"></script>
    <!-- Google Fonts & Icons -->
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;600&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

    <style>
        :root {
            --bg: #0b0f19;
            --card-bg: rgba(22, 29, 45, 0.7);
            --primary: #38bdf8;
            --accent: #818cf8;
            --success: #10b981;
            --danger: #ef4444;
            --warning: #f59e0b;
            --text: #f8fafc;
        }

        body {
            font-family: 'Outfit', sans-serif;
            background-color: var(--bg);
            background-image: radial-gradient(circle at 50% 50%, #1e293b 0%, #0b0f19 100%);
            color: var(--text);
            margin: 0;
            display: flex;
            flex-direction: column;
            align-items: center;
            min-height: 100vh;
        }

        .header {
            width: 100%;
            padding: 2rem 0;
            text-align: center;
            background: rgba(15, 23, 42, 0.5);
            backdrop-filter: blur(10px);
            border-bottom: 1px solid rgba(255, 255, 255, 0.05);
            margin-bottom: 2rem;
        }

        h1 {
            margin: 0;
            font-weight: 600;
            letter-spacing: -1px;
            background: linear-gradient(to right, var(--primary), var(--accent));
            -webkit-background-clip: text;
            background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        .dashboard-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(300px, 1fr));
            gap: 1.5rem;
            width: 90%;
            max-width: 1200px;
            padding-bottom: 3rem;
        }

        .card {
            background: var(--card-bg);
            padding: 1.5rem;
            border-radius: 1.25rem;
            border: 1px solid rgba(255, 255, 255, 0.05);
            backdrop-filter: blur(12px);
            transition: transform 0.3s ease;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
        }

        .card:hover {
            transform: translateY(-5px);
        }

        .card-title {
            font-size: 0.875rem;
            text-transform: uppercase;
            letter-spacing: 0.05em;
            color: #94a3b8;
            margin-bottom: 1rem;
        }

        .value {
            font-size: 3rem;
            font-weight: 600;
            margin: 0.5rem 0;
        }

        .unit {
            font-size: 1rem;
            color: #64748b;
            margin-left: 0.25rem;
        }

        .relay-status {
            width: 80px;
            height: 80px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 1.5rem;
            box-shadow: 0 0 20px rgba(0, 0, 0, 0.2);
            transition: 0.5s;
        }

        .status-on {
            background: var(--success);
            box-shadow: 0 0 30px rgba(16, 185, 129, 0.4);
        }

        .status-off {
            background: var(--danger);
            box-shadow: 0 0 30px rgba(239, 68, 68, 0.4);
        }

        .alerts-panel {
            grid-column: 1 / -1;
            background: var(--card-bg);
            border-radius: 1.25rem;
            padding: 1.5rem;
            max-height: 300px;
            overflow-y: auto;
        }

        .alert-item {
            display: flex;
            align-items: center;
            padding: 0.75rem;
            border-bottom: 1px solid rgba(255, 255, 255, 0.05);
            animation: slideIn 0.3s ease-out;
        }

        @keyframes slideIn {
            from {
                opacity: 0;
                transform: translateX(-10px);
            }

            to {
                opacity: 1;
                transform: translateX(0);
            }
        }

        .alert-icon {
            margin-right: 1rem;
            font-size: 1.25rem;
        }

        .alert-surcharge {
            color: var(--danger);
        }

        .alert-normal {
            color: var(--success);
        }

        .timestamp {
            font-size: 0.75rem;
            color: #64748b;
            margin-left: auto;
        }
    </style>
</head>

<body>

    <div class="header">
        <h1>Smart Energy Monitoring</h1>
        <p id="conn-status" style="font-size: 0.8rem; color: #64748b;">
            <i class="fas fa-circle" style="color: var(--danger); margin-right: 5px;"></i> Déconnecté de Firebase
        </p>
    </div>

    <div class="dashboard-grid">
        <!-- Puissance -->
        <div class="card">
            <div class="card-title"><i class="fas fa-bolt"></i> Puissance Actuelle</div>
            <div class="value" id="val-power">0.0<span class="unit">W</span></div>
            <div style="width: 100%; height: 4px; background: #334155; border-radius: 2px; margin-top: 10px;">
                <div id="bar-power"
                    style="width: 0%; height: 100%; background: var(--primary); border-radius: 2px; transition: 0.5s;">
                </div>
            </div>
        </div>

        <!-- Courant -->
        <div class="card">
            <div class="card-title"><i class="fas fa-microchip"></i> Intensité</div>
            <div class="value" id="val-current">0.00<span class="unit">A</span></div>
        </div>

        <!-- État Relais -->
        <div class="card">
            <div class="card-title">État du Relais</div>
            <div id="relay-indicator" class="relay-status status-off">
                <i class="fas fa-power-off"></i>
            </div>
            <p id="relay-text" style="margin-top: 10px; font-weight: 600;">OFF</p>
        </div>

        <!-- Alertes -->
        <div class="alerts-panel">
            <div class="card-title"><i class="fas fa-bell"></i> Historique des Alertes</div>
            <div id="alerts-list">
                <!-- Les alertes s'afficheront ici -->
                <div style="text-align: center; color: #64748b; padding: 2rem;">Aucune donnée reçue.</div>
            </div>
        </div>
    </div>

    <script>
        // ─── CONFIGURATION FIREBASE ─────────────────────
        const firebaseConfig = {
            databaseURL: "https://smart-energy-iot-461ff-default-rtdb.firebaseio.com"
        };

        const demoMode = false; // 🎯 ÉTAPE 1.3 : DÉSACTIVÉ

        // ─── INITIALISATION ─────────────────────────────
        firebase.initializeApp(firebaseConfig);
        const db = firebase.database();

        // ─── ÉLÉMENTS DOM ────────────────────────────────
        const elPower = document.getElementById('val-power');
        const elCurrent = document.getElementById('val-current');
        const elRelay = document.getElementById('relay-indicator');
        const elRelayText = document.getElementById('relay-text');
        const elBarPower = document.getElementById('bar-power');
        const elAlerts = document.getElementById('alerts-list');
        const elConn = document.getElementById('conn-status');

        // ─── LOGIQUE DE MISE À JOUR ─────────────────────
        function updateUI(data) {
            const power = data.power_W || 0;
            const current = data.current_A || 0;
            // Déterminer l'état (ON si relay=1 ou si relay_open=false)
            let isON = false;
            if (data.relay !== undefined) {
                isON = (data.relay === 1 || data.relay === true);
            } else if (data.relay_open !== undefined) {
                isON = (data.relay_open === false || data.relay_open === 0);
            }

            // Update Text
            elPower.innerHTML = `${power.toFixed(1)}<span class="unit">W</span>`;
            elCurrent.innerHTML = `${current.toFixed(2)}<span class="unit">A</span>`;

            // Update Progress Bar
            const percent = Math.min((power / 400) * 100, 100);
            elBarPower.style.width = `${percent}%`;
            elBarPower.style.backgroundColor = power > 300 ? 'var(--danger)' : 'var(--primary)';

            // Update Relay
            if (isON) {
                elRelay.className = "relay-status status-on";
                elRelayText.innerText = "ACTIF (ON)";
                elRelayText.style.color = "var(--success)";
            } else {
                elRelay.className = "relay-status status-off";
                elRelayText.innerText = "COUPÉ (OFF)";
                elRelayText.style.color = "var(--danger)";
            }
        }

        function addAlert(alert) {
            if (!alert) return;
            const isSurcharge = alert.type === 'SURCHARGE';
            const icon = isSurcharge ? 'fa-triangle-exclamation' : 'fa-circle-check';
            const cls = isSurcharge ? 'alert-surcharge' : 'alert-normal';

            const html = `
                <div class="alert-item">
                    <i class="fas ${icon} alert-icon ${cls}"></i>
                    <div>
                        <div style="font-weight: 600;">${alert.type}</div>
                        <div style="font-size: 0.85rem; color: #94a3b8;">${alert.action} (${alert.power_W}W)</div>
                    </div>
                    <div class="timestamp">${new Date(alert.ts).toLocaleTimeString()}</div>
                </div>
            `;

            // Supprimer le message "Aucune donnée"
            if (elAlerts.innerText.includes("Aucune donnée")) elAlerts.innerHTML = "";

            elAlerts.insertAdjacentHTML('afterbegin', html);
        }

        // ─── ÉCOUTE FIREBASE ────────────────────────────
        if (!demoMode) {
            // Écouter les dernières mesures
            db.ref('readings').limitToLast(1).on('child_added', (snapshot) => {
                const data = snapshot.val();
                updateUI(data);
                elConn.innerHTML = `<i class="fas fa-circle" style="color: var(--success); margin-right: 5px;"></i> Connecté à Firebase`;
            });

            // Écouter les dernières alertes
            db.ref('alerts').limitToLast(5).on('child_added', (snapshot) => {
                addAlert(snapshot.val());
            });
        } else {
            // Mode Démo (pour test visuel)
            elConn.innerHTML = `<i class="fas fa-circle" style="color: var(--warning); margin-right: 5px;"></i> Mode Démo Actif`;
            setInterval(() => {
                const p = Math.random() * 350;
                updateUI({ power_W: p, current_A: p / 230, relay: p < 300 });
            }, 3000);
        }
    </script>
</body>

</html>
